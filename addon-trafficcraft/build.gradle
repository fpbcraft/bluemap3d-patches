plugins {
    id 'bluemap3d-common'
}

version = '1.0.26'

ext {
    mod_id = 'bluemap_trafficcraft_compat'
    mod_name = 'BlueMap TrafficCraft Compat'
    mod_description = 'Restores TrafficCraft client-side paint colors in BlueMap 5.7 terrain rendering.'
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:5.7"
    compileOnly "de.bluecolored:bluemap-common:5.7"
}

processResources {
    filesMatching('bluemap.addon.json') {
        expand(version: project.version)
    }
}

afterEvaluate {
    base {
        archivesName = 'bluemap-trafficcraft-compat'
    }
}
