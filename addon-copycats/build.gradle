plugins {
    id 'bluemap3d-common'
}

version = '1.0.26'

ext {
    mod_id = 'bluemap_copycats_compat'
    mod_name = 'BlueMap Copycats Compat'
    mod_description = 'Renders Copycats+ and Create: Connected copycats in BlueMap static terrain using their per-block copied materials.'
}

dependencies {
    // This is a native BlueMap pack/addon, not a NeoForge mod and not a BlueMap3D addon.
    // Compile against the exact BlueMap core/common ABI used by the target server.
    compileOnly "de.bluecolored:bluemap-core:5.7"
    compileOnly "de.bluecolored:bluemap-common:5.7"
}

processResources {
    filesMatching('bluemap.addon.json') {
        expand(version: project.version)
    }
}

afterEvaluate {
    base {
        archivesName = 'bluemap-copycats-compat'
    }
}
