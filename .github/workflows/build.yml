name: Build BlueMap3D patches

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Resolve immutable development version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          version="$(python3 scripts/release_metadata.py --lines | sed -n '1p')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Build BlueMap compatibility artifacts
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: bluemap3d-patches-${{ steps.release.outputs.version }}
          path: dist/*
          if-no-files-found: error
