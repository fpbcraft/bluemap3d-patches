name: Build BlueMap3D patches

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Resolve immutable build version
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$(python3 scripts/release_metadata.py --base-version)"
          version="$(python3 scripts/release_version.py dev --base "$base" --sha "$SOURCE_SHA")"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Read release metadata
        id: release
        run: echo "version=$(python3 scripts/release_metadata.py --lines | sed -n '1p')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test seasonal browser layer
        run: |
          npm ci --prefix tests/seasonal
          npm test --prefix tests/seasonal
          cd tests/seasonal
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Build BlueMap compatibility artifacts
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: bluemap3d-patches-${{ steps.release.outputs.version }}
          path: dist/*
          if-no-files-found: error