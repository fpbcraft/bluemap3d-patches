name: Build BlueMap3D patches

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Read release metadata
        id: release
        run: echo "version=$(python3 scripts/release_metadata.py --lines | sed -n '1p')" >> "$GITHUB_OUTPUT"

      - name: Build BlueMap compatibility artifacts
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bluemap3d-patches-${{ steps.release.outputs.version }}
          path: dist/*
          if-no-files-found: error