plugins {
    id 'bluemap3d-common'
}

version = rootProject.version

ext {
    mod_id = 'bluemap_compat'
    mod_name = 'BlueMap Compatibility'
    mod_description = 'Unified BlueMap 5.7 compatibility: config-driven rules plus specialized material/dynamic-texture adapters.'
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:5.7"
    compileOnly "de.bluecolored:bluemap-common:5.7"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.google.code.gson:gson:2.10.1'
}

test {
    useJUnitPlatform()
}

processResources {
    filesMatching('bluemap.addon.json') {
        expand(version: project.version)
    }
}

afterEvaluate {
    base {
        archivesName = 'bluemap-compat'
    }
}
