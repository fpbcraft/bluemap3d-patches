plugins {
    id 'bluemap3d-common'
}

version = rootProject.version

ext {
    mod_id = 'bluemap_compat'
    mod_name = 'BlueMap Compatibility'
    mod_description = 'Unified BlueMap 5.7 compatibility: config-driven rules plus specialized material/dynamic-texture adapters.'
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:5.7"
    compileOnly "de.bluecolored:bluemap-common:5.7"

    // Production links to BlueMap at runtime, but tests instantiate its Color class.
    testImplementation "de.bluecolored:bluemap-core:5.7"
    testImplementation "de.bluecolored:bluemap-common:5.7"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
    testRuntimeOnly "com.google.code.gson:gson:2.14.0"
}

test {
    useJUnitPlatform()
}

processResources {
    filesMatching('bluemap.addon.json') {
        expand(version: project.version)
    }
}

afterEvaluate {
    base {
        archivesName = 'bluemap-compat'
    }
}
