name: Build BlueMap3D patches

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate release tooling
        shell: bash
        run: |
          python3 -m py_compile .github/scripts/release_version.py
          BASE="$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')"
          python3 .github/scripts/release_version.py next \
            --increment patch \
            --fallback "${BASE}" \
            --github-output /tmp/bluemap3d-release-version

      - name: Read release metadata
        id: release
        run: echo "version=$(python3 scripts/release_metadata.py --lines | sed -n '1p')" >> "$GITHUB_OUTPUT"

      - name: Build BlueMap compatibility artifacts
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: bluemap3d-patches-${{ steps.release.outputs.version }}
          path: dist/*
          if-no-files-found: error