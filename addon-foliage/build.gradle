plugins {
    id 'bluemap3d-common'
}

version = '1.0.26'

ext {
    mod_id = 'bluemap_foliage_compat'
    mod_name = 'BlueMap Foliage Compat'
    mod_description = 'Restores mod-specific foliage colors that BlueMap 5.7 otherwise treats as biome foliage.'
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:5.7"
    compileOnly "de.bluecolored:bluemap-common:5.7"
}

processResources {
    filesMatching('bluemap.addon.json') {
        expand(version: project.version)
    }
}

afterEvaluate {
    base {
        archivesName = 'bluemap-foliage-compat'
    }
}
